<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base target="_top">
  <style>
    :root {
      --green: #18371d;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, .72);
      --required: #ff3b30;
      --purple: #7b3fb4;
      --muted-purple: #695d7a;
    }
    * {
      box-sizing: border-box;
    }
    html {
      background: var(--green);
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      background: var(--green);
      color: var(--white);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 19px;
      line-height: 1.35;
    }
    main {
      width: 100%;
      padding: 28px 18px 80px;
    }
    header {
      margin-bottom: 42px;
    }
    .cafe-logo {
      display: block;
      width: 100%;
      max-width: 460px;
      height: auto;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 36px);
      line-height: .95;
      letter-spacing: -.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    /* SECTIONS */
    .repair-section {
      margin-bottom: 55px;
    }
    .section-title {
      margin: 0 0 32px;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: .7px;
      text-transform: uppercase;
    }
    /* FIELDS */
    .field {
      display: block;
      margin-bottom: 30px;
      font-size: 20px;
      font-weight: 700;
    }
    .required {
      margin-left: 1px;
      color: var(--required);
      font-weight: 800;
    }
    .optional {
      color: var(--muted);
      font-size: 15px;
      font-weight: normal;
    }
    input[type="text"],
    textarea {
      display: block;
      width: 100%;
      min-height: 60px;
      margin-top: 9px;
      padding: 14px 15px;
      border: 0;
      border-radius: 0;
      background: white;
      color: black;
      font: inherit;
      font-size: 18px;
    }
    textarea {
      min-height: 125px;
      resize: vertical;
    }
    input[type="text"]:focus,
    textarea:focus {
      outline: 4px solid #9eb6a1;
    }
    /* AUTOCOMPLETE */
    .autocomplete-control {
      position: relative;
      margin-top: 9px;
    }
    .autocomplete-control input[type="text"] {
      margin-top: 0;
    }
    .autocomplete-menu {
      display: none;
      background: white;
      color: #111;
    }
    .autocomplete-menu.open {
      display: block;
    }
    .autocomplete-option {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 11px 15px;
      border: 0;
      border-top: 1px solid #ddd;
      background: white;
      color: #111;
      font: inherit;
      font-size: 17px;
      text-align: left;
      cursor: pointer;
    }
    .autocomplete-option.add {
      color: var(--green);
      font-weight: 800;
    }
    .autocomplete-empty {
      padding: 12px 15px;
      border-top: 1px solid #ddd;
      background: white;
      color: #555;
      font-size: 16px;
      font-weight: normal;
    }
    /* CHOICES */
    fieldset {
      margin: 0 0 38px;
      padding: 0;
      border: 0;
    }
    legend {
      width: 100%;
      margin-bottom: 13px;
      font-size: 20px;
      font-weight: 700;
    }
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .choice {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 64px;
      padding: 14px 15px;
      background: white;
      color: black;
      font-size: 18px;
      cursor: pointer;
    }
    .choice input {
      width: 25px;
      height: 25px;
      margin: 0 14px 0 0;
      flex-shrink: 0;
      accent-color: var(--green);
    }
    .emoji {
      margin-right: 9px;
      font-size: 27px;
    }
    /* PHOTOS */
    .photo-block {
      margin: 31px 0 42px;
    }
    .photo-heading {
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 700;
    }
    .camera-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 72px;
      padding: 11px 16px;
      border: 0;
      background: white;
      color: var(--green);
      font: inherit;
      cursor: pointer;
    }
    .camera-button-main {
      font-size: 19px;
      font-weight: 700;
    }
    .camera-button-sub {
      margin-top: 3px;
      font-size: 13px;
      font-weight: 400;
      opacity: .7;
    }
    .camera-button:disabled {
      opacity: .55;
    }
    .camera-button.is-loading {
      background: #d7d7d7;
      color: #555;
      opacity: 1;
      cursor: wait;
    }
    .photo-inputs {
      display: none;
    }
    .photo-previews {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .photo-preview {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: visible;
      background: white;
    }
    .photo-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-delete {
      position: absolute;
      top: -7px;
      right: -7px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 29px;
      height: 29px;
      padding: 0;
      border: 2px solid white;
      border-radius: 50%;
      background: #d92d20;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 21px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, .4);
    }
    /* LOADING */
    button.is-loading {
      position: relative;
      cursor: wait;
    }
    button.is-loading > * {
      opacity: 0;
    }
    button.is-loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border: 3px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      pointer-events: none;
      animation: button-spin .75s linear infinite;
    }
    @keyframes button-spin {
      to { transform: rotate(360deg); }
    }
    .loading-track {
      position: relative;
      display: none;
      width: 100%;
      height: 6px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: rgba(255, 255, 255, .22);
    }
    .autocomplete-control.loading .loading-track {
      display: block;
    }
    .loading-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -110px;
      width: 110px;
      background: rgba(255, 255, 255, .9);
      animation: loading-progress 1.1s ease-in-out infinite;
    }
    @keyframes loading-progress {
      from {
        left: -110px;
      }
      to {
        left: 100%;
      }
    }
    /* SUBMIT */
    .submit-wrap {
      width: 44%;
      min-width: 170px;
      margin: 12px 0 22px auto;
    }
    button.submit {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 72px;
      padding: 14px 18px;
      border: 0;
      background: var(--purple);
      color: white;
      font: inherit;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }
    button.submit:disabled {
      background: var(--muted-purple);
      color: white;
      opacity: 1;
      cursor: wait;
    }
    #message {
      margin: 0 0 18px;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }
    /* SUCCESS */
    .saved-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 1001;
      padding: 18px 28px;
      background: white;
      color: var(--green);
      border: 4px solid var(--green);
      box-shadow: 9px 9px 0 rgba(0, 0, 0, .55);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: .5px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.8) rotate(-3deg);
      transition: opacity .18s ease, transform .18s ease;
    }
    .saved-toast.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(-3deg);
    }
    #confettiLayer {
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 18px;
      opacity: 1;
      animation: confetti-fall 1.8s ease-out forwards;
    }
    @keyframes confetti-fall {
      from {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: .2;
      }
    }
    form.is-submitting .form-content {
      pointer-events: none;
    }
    /* DESKTOP */
    @media (min-width: 800px) {
      main {
        max-width: 720px;
        margin: 0 auto;
        padding-top: 48px;
      }
      .photo-previews {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

    <form id="repairForm" autocomplete="off">
      <input type="hidden" name="deviceId" id="deviceId">

      <input type="hidden" name="photoAfterCount" id="photoAfterCount" value="0">

        <section class="repair-section">
          <label class="field" for="f1">

            <input type="text" name="f1" id="f1" autocomplete="off" writingsuggestions="false" placeholder="First Last" required >
          </label>
          <label class="field" for="f2">
            Guest's name<span class="required">*</span>
            <input type="text" name="f2" id="f2" autocomplete="off" writingsuggestions="false" placeholder="First Last" required >

            <label for="f3">
              Item type<span class="required">*</span>
            </label>
            <div class="autocomplete-control" id="itemTypeControl" >
              <input type="text" name="f3" id="f3" autocomplete="off" writingsuggestions="false" placeholder="e.g. toaster" required >
              <div class="loading-track" aria-hidden="true" >
                <div class="loading-bar"></div>
              </div>
              <div class="autocomplete-menu" id="itemTypeMenu" ></div>
            </div>
          </div>
          <div class="field">
            <label for="f4">
              Brand
              <span class="optional">(optional)</span>
            </label>
            <div class="autocomplete-control" id="brandControl" >
              <input type="text" name="f4" id="f4" autocomplete="off" writingsuggestions="false" placeholder="e.g. Bosch" >
              <input type="hidden" name="brandStatus" id="brandStatus" >
              <div class="loading-track" aria-hidden="true" >
                <div class="loading-bar"></div>
              </div>
              <div class="autocomplete-menu" id="brandMenu" ></div>
            </div>
          </div>
          <label class="field" for="f5">

            <input type="text" name="f5" id="f5" autocomplete="off" writingsuggestions="false" >
          </label>
          <div class="photo-block">
            <div class="photo-heading">
              Pre-repair photo(s)
              <span class="optional">(optional)</span>
            </div>
            <div class="photo-action" id="beforePhotoAction" >
              <button type="button" class="camera-button" id="beforePhotoButton" onclick="addPhoto('before')" >

                  up to 5 photos

            </div>

                Success

              <label class="choice">

              <label class="choice">

              <label class="choice">

  <script>
    const MAX_PHOTOS = 5;
    const MAX_IMAGE_DIMENSION = 1800;
    const MAX_IMAGE_BYTES = 325 * 1024;
    const JPEG_QUALITY = 0.82;
    const AUTOCOMPLETE_DELAY = 300;
    const byId = id => document.getElementById(id);
    const form = byId('repairForm');
    const canonicalFields = {
      volunteerName: 'f1', guestName: 'f2', itemType: 'f3', brand: 'f4',
      modelInfo: 'f5', problemSolution: 'f6', guestReflection: 'f7',
      toolPurchaseRequests: 'f8'
    };
    let submitting = false;
    let lockedScrollY = 0;

    // Storage is optional: privacy settings must not prevent use of the form.
    function readSaved(key) {
      try { return localStorage.getItem(key) || ''; }
      catch { return ''; }
    }

    function saveSetting(key, value) {
      try { localStorage.setItem(key, value); }
      catch { /* Continue without remembering this setting. */ }
    }

    const deviceId = readSaved('repairCafeDeviceId') || `device-${
      window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`
    }`;
    saveSetting('repairCafeDeviceId', deviceId);
    byId('deviceId').value = deviceId;
    byId('f1').value = readSaved('repairCafeVolunteerName');
    byId('f1').addEventListener('input', event => {
      saveSetting('repairCafeVolunteerName', event.target.value);
    });

    const TAXONOMY_CACHE_KEY = 'repairCafeTaxonomiesV1';
    const TAXONOMY_MAX_AGE = 7 * 24 * 60 * 60 * 1000;
    const taxonomyData = { products: [], brands: [] };

    const autocomplete = {
      itemType: {
        input: byId('f3'), list: 'products',
        message: 'Choose an item type from the list.'
      },
      brand: {
        input: byId('f4'), list: 'brands',
        message: 'Choose a brand from the list or add this brand.'
      }
    };

    function readTaxonomyCache() {
      try {
        const cached = JSON.parse(localStorage.getItem(TAXONOMY_CACHE_KEY) || 'null');
        if (!cached || !Array.isArray(cached.products) || !Array.isArray(cached.brands)) return null;
        return cached;
      } catch {
        return null;
      }
    }

    function saveTaxonomyCache(products, brands) {
      try {
        localStorage.setItem(TAXONOMY_CACHE_KEY, JSON.stringify({
          savedAt: Date.now(),
          products,
          brands
        }));
      } catch {
        // The form still works for this visit if persistent storage is unavailable.
      }
    }

    async function fetchTaxonomies() {
      const [productsResponse, brandsResponse] = await Promise.all([
        fetch('/data/products.json', { cache: 'no-cache' }),
        fetch('/data/brands.json', { cache: 'no-cache' })
      ]);
      if (!productsResponse.ok || !brandsResponse.ok) {
        throw new Error('Could not load autocomplete lists.');
      }
      const [products, brands] = await Promise.all([
        productsResponse.json(),
        brandsResponse.json()
      ]);
      if (!Array.isArray(products) || !Array.isArray(brands)) {
        throw new Error('Autocomplete lists are invalid.');
      }
      taxonomyData.products = products;
      taxonomyData.brands = brands;
      saveTaxonomyCache(products, brands);
    }

    const cachedTaxonomies = readTaxonomyCache();
    if (cachedTaxonomies) {
      taxonomyData.products = cachedTaxonomies.products;
      taxonomyData.brands = cachedTaxonomies.brands;
    }

    const taxonomyReady = (async () => {
      if (!cachedTaxonomies || Date.now() - Number(cachedTaxonomies.savedAt || 0) > TAXONOMY_MAX_AGE) {
        try {
          await fetchTaxonomies();
        } catch (error) {
          if (!cachedTaxonomies) throw error;
          console.warn('Using cached autocomplete lists because refresh failed.', error);
        }
      }
    })();

    for (const [kind, state] of Object.entries(autocomplete)) {
      Object.assign(state, {
        control: byId(`${kind}Control`), menu: byId(`${kind}Menu`),
        selected: false, requestId: 0, timer: null
      });
      state.input.addEventListener('input', () => {
        state.selected = false;
        state.input.setCustomValidity(state.input.value.trim() ? state.message : '');
        if (kind === 'brand') byId('brandStatus').value = '';
        cancelAutocomplete(state);
        const query = state.input.value.trim();
        if (query.length >= 2) {
          state.timer = setTimeout(() => loadAutocomplete(kind, query), AUTOCOMPLETE_DELAY);
        }
      });
    }

    function cancelAutocomplete(state) {
      clearTimeout(state.timer);
      state.requestId++;
      state.control.classList.remove('loading');
      state.menu.classList.remove('open');
    }

    function localMatches(values, query, limit = 20) {
      const q = query.toLocaleLowerCase();
      const starts = [];
      const contains = [];

      for (const value of values) {
        const lower = value.toLocaleLowerCase();
        if (lower.startsWith(q)) {
          starts.push(value);
        } else if (lower.includes(q)) {
          contains.push(value);
        }
      }

      return starts.concat(contains)
        .slice(0, limit)
        .map(value => ({ value, label: value }));
    }

    async function loadAutocomplete(kind, query) {
      const state = autocomplete[kind];
      const requestId = ++state.requestId;
      const isCurrent = () => requestId === state.requestId && state.input.value.trim() === query;

      state.control.classList.add('loading');

      try {
        await taxonomyReady;
        if (!isCurrent()) return;

        const results = localMatches(taxonomyData[state.list], query);
        state.control.classList.remove('loading');
        renderAutocomplete(kind, results, query);
      } catch (error) {
        if (!isCurrent()) return;
        state.control.classList.remove('loading');
        showAutocompleteMessage(state, 'Could not load choices. Reload the page and try again.');
      }
    }

    function renderAutocomplete(kind, results, query) {
      const state = autocomplete[kind];
      state.menu.replaceChildren();
      for (const result of results) {
        addAutocompleteOption(kind, result.label || result.value, result.value, 'existing');
      }
      const exactMatch = results.some(result => String(result.value).trim().toLowerCase() === query.toLowerCase());
      if (kind === 'brand' && !exactMatch) {
        addAutocompleteOption(kind, `+ Add brand “${query}”`, query, 'new');
      }
      if (!state.menu.children.length) {
        showAutocompleteMessage(state, 'No matches.');
      } else {
        state.menu.classList.add('open');
      }
    }

    function addAutocompleteOption(kind, label, value, status) {
      const state = autocomplete[kind];
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `autocomplete-option${status === 'new' ? ' add' : ''}`;
      button.textContent = label;
      button.addEventListener('click', () => {
        cancelAutocomplete(state);
        state.selected = true;
        state.input.value = value;
        state.input.setCustomValidity('');
        if (kind === 'brand') byId('brandStatus').value = status;
      });
      state.menu.appendChild(button);
    }

    function showAutocompleteMessage(state, message) {
      const row = document.createElement('div');
      row.className = 'autocomplete-empty';
      row.textContent = message;
      state.menu.replaceChildren(row);
      state.menu.classList.add('open');
    }

    function resetAutocompletes() {
      for (const state of Object.values(autocomplete)) {
        cancelAutocomplete(state);
        state.selected = false;
        state.input.setCustomValidity('');
      }
      byId('brandStatus').value = '';
    }

    document.addEventListener('click', event => {
      for (const state of Object.values(autocomplete)) {
        if (!state.control.contains(event.target)) cancelAutocomplete(state);
      }
    });

    // Photos are resized locally, then sent as file inputs for Apps Script.
    function newPhotoState() {
      return { nextIndex: 1, pending: null, processing: false, items: {} };
    }

    const photoState = { before: newPhotoState(), after: newPhotoState() };
    const photoPrefix = stage => stage === 'before' ? 'photoBefore' : 'photoAfter';

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('Could not read image.'));
        image.src = url;
      });
    }

    async function optimizePhoto(file) {
      const sourceUrl = URL.createObjectURL(file);
      try {
        const image = await loadImage(sourceUrl);
        const initialScale = Math.min(1, MAX_IMAGE_DIMENSION / Math.max(image.naturalWidth, image.naturalHeight));
        let width = Math.max(1, Math.round(image.naturalWidth * initialScale));
        let height = Math.max(1, Math.round(image.naturalHeight * initialScale));
        let quality = JPEG_QUALITY;
        let blob = null;

        for (let attempt = 0; attempt < 12; attempt++) {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext('2d');
          if (!context) throw new Error('Image processing is unavailable.');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, width, height);
          context.drawImage(image, 0, 0, width, height);
          blob = await new Promise((resolve, reject) => {
            canvas.toBlob(result => result ? resolve(result) : reject(new Error('Could not resize image.')),
              'image/jpeg', quality);
          });
          if (blob.size <= MAX_IMAGE_BYTES) break;

          if (quality > 0.58) {
            quality = Math.max(0.58, quality - 0.08);
          } else if (Math.max(width, height) > 900) {
            width = Math.max(1, Math.round(width * 0.82));
            height = Math.max(1, Math.round(height * 0.82));
            quality = 0.72;
          } else {
            quality = Math.max(0.45, quality - 0.05);
          }
        }

        if (!blob || blob.size > MAX_IMAGE_BYTES * 1.15) {
          throw new Error('Photo is too large to upload.');
        }
        const name = (file.name || 'photo').replace(/\.[^.]+$/, '') || 'photo';
        return new File([blob], `${name}.jpg`, { type: 'image/jpeg', lastModified: Date.now() });
      } finally {
        URL.revokeObjectURL(sourceUrl);
      }
    }

    function addPhoto(stage) {
      const state = photoState[stage];
      if (submitting || state.processing || Object.keys(state.items).length >= MAX_PHOTOS) return;
      if (state.pending) return state.pending.click();
      const index = state.nextIndex;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.name = photoPrefix(stage) + index;
      byId(`${stage}PhotoInputs`).appendChild(input);
      state.pending = input;
      input.addEventListener('change', async () => {
        if (!input.files.length) return;
        state.processing = true;
        updatePhotoButton(stage);
        try {
          const file = await optimizePhoto(input.files[0]);
          const transfer = new DataTransfer();
          transfer.items.add(file);
          input.files = transfer.files;
          showPhotoPreview(stage, index, input, file);
          state.nextIndex++;
          state.pending = null;
        } catch (error) {
          input.remove();
          state.pending = null;
          console.error(error);
          alert('Could not prepare that photo. Please try a JPEG or PNG image.');
        } finally {
          state.processing = false;
          updatePhotoButton(stage);
        }
      });
      input.click();
    }

    function showPhotoPreview(stage, index, input, file) {
      const wrapper = document.createElement('div');
      const image = document.createElement('img');
      const button = document.createElement('button');
      const objectUrl = URL.createObjectURL(file);
      wrapper.className = 'photo-preview';
      image.src = objectUrl;
      image.alt = 'Selected photo';
      button.type = 'button';
      button.className = 'photo-delete';
      button.textContent = '×';
      button.setAttribute('aria-label', 'Delete photo');
      button.addEventListener('click', () => {
        if (submitting) return;
        URL.revokeObjectURL(objectUrl);
        input.remove();
        wrapper.remove();
        delete photoState[stage].items[index];
        updatePhotoButton(stage);
      });
      wrapper.append(image, button);
      byId(`${stage}PhotoPreviews`).appendChild(wrapper);
      photoState[stage].items[index] = { input, objectUrl };
    }

    function updatePhotoButton(stage) {
      const state = photoState[stage];
      const count = Object.keys(state.items).length;
      const button = byId(`${stage}PhotoButton`);
      setButtonLoading(button, state.processing);
      button.disabled = state.processing || count >= MAX_PHOTOS;
      button.querySelector('.camera-button-main').textContent = count >= MAX_PHOTOS
        ? 'Maximum photos added' : count ? '📷 Add another photo' : '📷 Add photo';
      button.querySelector('.camera-button-sub').textContent = count >= MAX_PHOTOS
        ? `${MAX_PHOTOS} photos` : `up to ${MAX_PHOTOS} photos`;
      byId('submitButton').disabled = submitting || Object.values(photoState).some(state => state.processing);
    }

    function resetPhotoArea(stage) {
      Object.values(photoState[stage].items).forEach(item => URL.revokeObjectURL(item.objectUrl));
      photoState[stage] = newPhotoState();
      byId(`${stage}PhotoInputs`).replaceChildren();
      byId(`${stage}PhotoPreviews`).replaceChildren();
      byId(`${photoPrefix(stage)}Count`).value = '0';
      updatePhotoButton(stage);
    }

    function prepareCanonicalFields() {
      removeCanonicalFields();
      for (const [name, id] of Object.entries(canonicalFields)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = byId(id).value.trim();
        input.dataset.canonical = 'true';
        form.appendChild(input);
      }
      // Renumber surviving photos after deletions so counts stay bounded at five.
      for (const [stage, state] of Object.entries(photoState)) {
        state.pending?.remove();
        state.pending = null;
        const items = Object.values(state.items);
        items.forEach((item, i) => { item.input.name = photoPrefix(stage) + (i + 1); });
        byId(`${photoPrefix(stage)}Count`).value = items.length;
      }
    }

    function removeCanonicalFields() {
      form.querySelectorAll('[data-canonical]').forEach(input => input.remove());
    }

    function setButtonLoading(button, loading) {
      button.disabled = loading;
      button.classList.toggle('is-loading', loading);
      button.setAttribute('aria-busy', String(loading));
    }

    function setSubmitting(value) {
      submitting = value;
      setButtonLoading(byId('submitButton'), value);
      form.classList.toggle('is-submitting', value);
      form.querySelector('.form-content').inert = value;
      form.setAttribute('aria-busy', String(value));
      if (value) lockedScrollY = window.scrollY;
      Object.assign(document.body.style, {
        position: value ? 'fixed' : '', top: value ? `-${lockedScrollY}px` : '',
        left: value ? '0' : '', right: value ? '0' : '', width: value ? '100%' : ''
      });
      if (!value) window.scrollTo(0, lockedScrollY);
    }

    function handleSubmitSuccess() {
      removeCanonicalFields();
      const savedName = byId('f1').value;
      form.reset();
      byId('deviceId').value = deviceId;
      byId('f1').value = savedName;
      resetAutocompletes();
      resetPhotoArea('before');
      resetPhotoArea('after');
      setSubmitting(false);
      byId('message').textContent = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      celebrate();
    }

    function handleSubmitFailure(error) {
      removeCanonicalFields();
      setSubmitting(false);
      byId('message').textContent = `Error: ${error?.message || 'Submission failed. Please try again.'}`;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (submitting || Object.values(photoState).some(state => state.processing)) return;
      for (const state of Object.values(autocomplete)) {
        if (state.input.value.trim() && !state.selected) state.input.setCustomValidity(state.message);
      }
      if (!form.reportValidity()) return;
      prepareCanonicalFields();
      byId('message').textContent = '';
      setSubmitting(true);
      try {
        const response = await fetch('/api', {
          method: 'POST',
          body: new FormData(form)
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'Submission failed. Please try again.');
        handleSubmitSuccess(data.submissionId);
      } catch (error) {
        handleSubmitFailure(error);
      }
    });

    function celebrate() {
      const layer = byId('confettiLayer');
      const toast = byId('savedToast');
      const colors = ['#ffffff', '#ffdc5d', '#ff6b6b', '#8bd3a1', '#f4a7c0'];
      layer.replaceChildren();
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (let i = 0; i < 60; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          Object.assign(piece.style, {
            left: `${Math.random() * 100}vw`,
            background: colors[Math.floor(Math.random() * colors.length)],
            animationDelay: `${Math.random() * .35}s`,
            animationDuration: `${1.4 + Math.random() * .9}s`
          });
          layer.appendChild(piece);
        }
      }
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 1200);
      setTimeout(() => layer.replaceChildren(), 2600);
    }
  </script>
</body>
</html>
