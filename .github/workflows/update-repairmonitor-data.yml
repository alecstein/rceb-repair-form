name: Update RepairMonitor taxonomy

on:
  schedule:
    # First day of every month at 8:00 UTC
    - cron: "0 8 1 * *"

  # Also gives you a "Run workflow" button in GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-taxonomy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download RepairMonitor data
        env:
          PRODUCT_URL: "https://www.repairmonitor.org/en/kind_product_autocomplete/taxonomy_term/default%3Ataxonomy_term/HnNwTT2VlSuQATdNR_eXD-f1b4Q797uTKVyIhd2Kdjk"
          BRAND_URL: "https://www.repairmonitor.org/en/brand_autocomplete/taxonomy_term/default%3Ataxonomy_term/gEOAwRaHjAqY5yzY4R7uND2yYOY1Zg_vOGhm4pd2Nsk"
        run: |
          mkdir -p public/data

          curl --fail --silent --show-error --get "$PRODUCT_URL" \
            --data-urlencode 'q= ' \
            -o /tmp/products-raw.json

          curl --fail --silent --show-error --get "$BRAND_URL" \
            --data-urlencode 'q= ' \
            -o /tmp/brands-raw.json

      - name: Build clean taxonomy files
        run: |
          jq '
            map(.value | select(type == "string" and length > 0))
            | sort_by(ascii_downcase)
            | group_by(ascii_downcase)
            | map(.[0])
          ' /tmp/products-raw.json > public/data/products.json

          jq '
            map(.value | select(type == "string" and length > 0))
            | sort_by(ascii_downcase)
            | group_by(ascii_downcase)
            | map(.[0])
          ' /tmp/brands-raw.json > public/data/brands.json

          echo "Products: $(jq length public/data/products.json)"
          echo "Brands:   $(jq length public/data/brands.json)"

      - name: Commit changes
        run: |
          if git diff --quiet -- public/data/products.json public/data/brands.json; then
            echo "RepairMonitor data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/products.json public/data/brands.json
          git commit -m "Update RepairMonitor taxonomy"
          git push
